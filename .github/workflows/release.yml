name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.targets.outputs.tag }}
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - name: Select release platforms
        id: targets
        run: |
          tag=$(cat VERSION)
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          go tool dist list | python3 -c '
          import json
          import sys

          targets = []
          for line in sys.stdin:
              os, arch = line.strip().split("/")
              if os in {"linux", "darwin", "windows"}:
                  targets.append({"os": os, "arch": arch})

          print("matrix=" + json.dumps({"include": targets}, separators=(",", ":")))
          print("count=" + str(len(targets)))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Build and package binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p bin packages
          archive="glm-api-$TAG-$GOOS-$GOARCH"
          if [[ "$GOOS" == windows ]]; then
            go build -trimpath -ldflags="-s -w" -o bin/glm-api.exe .
            zip -j "packages/$archive.zip" bin/glm-api.exe
          else
            if [[ "$GOARCH" == arm ]]; then
              export GOARM=5
            fi
            go build -trimpath -ldflags="-s -w" -o bin/glm-api .
            tar -czf "packages/$archive.tar.gz" -C bin glm-api
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          shopt -s nullglob
          archives=(packages/*.tar.gz packages/*.zip)
          [[ ${#archives[@]} -eq "$TARGET_COUNT" ]]
          (cd packages && sha256sum glm-api-*) > packages/SHA256SUMS

          if release=$(gh release view "$TAG" --json isDraft,targetCommitish); then
            if [[ $(jq -r .isDraft <<<"$release") == false ]]; then
              echo "$TAG is already published"
              exit 0
            fi
            [[ $(jq -r .targetCommitish <<<"$release") == "$GITHUB_SHA" ]]
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "glm-api $TAG" \
              --notes "Go proxy for Z.AI Coding Plan with OpenAI Chat Completions and Anthropic Messages APIs. Includes binaries for Linux, macOS and Windows and SHA-256 checksums."
          fi
          gh release upload "$TAG" --clobber "${archives[@]}" packages/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
