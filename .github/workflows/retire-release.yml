name: Retire superseded v1.0.0 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-release.yml]

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the replacement and retire the old version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/1.0" | jq -e '
            .draft == false and .prerelease == false
            and .target_commitish == "f4dfdc2f9ef46377b4dbd84029e454ee1be0ccec"
            and ([.assets[] | select(.state == "uploaded" and .size > 0) | .name] | sort) == [
              "glm-api-1.0-darwin-amd64.tar.gz",
              "glm-api-1.0-darwin-arm64.tar.gz",
              "glm-api-1.0-linux-amd64.tar.gz",
              "glm-api-1.0-linux-arm64.tar.gz",
              "glm-api-1.0-windows-amd64.zip",
              "glm-api-1.0-windows-arm64.zip"
            ]
          '
          current_id=$(gh api "repos/$GH_REPO/releases/tags/v1.0.0" --jq .id)
          [[ "$current_id" == 453607928 ]]
          gh release delete v1.0.0 --cleanup-tag --yes
