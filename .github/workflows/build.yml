name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, suffix: "" }
          - { os: linux, arch: arm64, suffix: "" }
          - { os: darwin, arch: amd64, suffix: "" }
          - { os: darwin, arch: arm64, suffix: "" }
          - { os: windows, arch: amd64, suffix: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          BINARY: glm-api${{ matrix.suffix }}
        run: go build -trimpath -o "dist/$BINARY" .
      - uses: actions/upload-artifact@v7
        with:
          name: glm-api-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
